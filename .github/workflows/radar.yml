# Roda o Radar Catarata às 7h e às 17h (horário de Brasília), avisa por e-mail/WhatsApp
# quando há licitação nova e publica o painel no GitHub Pages.
name: Radar Catarata

on:
  schedule:
    - cron: "0 10,20 * * *"   # 10h e 20h UTC = 7h e 17h em Brasília
  workflow_dispatch:           # botão "Run workflow" para rodar na hora

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install pypdf

      - name: Coletar licitações
        run: python coletor.py

      - name: Avisar por e-mail e WhatsApp
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          PAINEL_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python avisar.py

      - name: Guardar histórico (caches e dados)
        if: always()
        run: |
          git config user.name "radar-catarata"
          git config user.email "radar-catarata@users.noreply.github.com"
          git add -A dados.json radar.html cache_*.json vistos_oss.json avisados.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Radar: atualização $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
          git push

      - name: Preparar painel
        run: mkdir -p _site && cp radar.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
