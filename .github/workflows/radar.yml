# Procura licitações a cada hora e avisa por e-mail/WhatsApp SÓ quando aparece algo novo.
# O agendador do GitHub costuma pular horários; por isso o fluxo é chamado a cada 15 minutos
# e a etapa "verificar" só libera a procura se a última terminou há 55 minutos ou mais.
name: Radar Catarata

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # a cada 15 min; a procura de verdade acontece 1x por hora
  workflow_dispatch:                # botão "Run workflow": procura na hora, sem esperar

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar-pages
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rodar: ${{ steps.tempo.outputs.rodar }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: dados.json
          sparse-checkout-cone-mode: false
      - name: Já passou 1 hora desde a última procura?
        id: tempo
        env:
          EVENTO: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          rodar = True
          if os.environ["EVENTO"] == "schedule":
              try:
                  fim = json.load(open("dados.json", encoding="utf-8")).get("concluido")
                  fim = datetime.strptime(fim, "%Y-%m-%d %H:%M").replace(tzinfo=ZoneInfo("America/Sao_Paulo"))
                  minutos = (datetime.now(ZoneInfo("America/Sao_Paulo")) - fim).total_seconds() / 60
                  rodar = minutos >= 55
                  print(f"Última procura concluída há {minutos:.0f} min.")
              except Exception as erro:
                  print(f"Sem horário da última procura ({erro}); procurando agora.")
          print("Procurar agora:", rodar)
          with open(os.environ["GITHUB_OUTPUT"], "a") as saida:
              saida.write(f"rodar={'true' if rodar else 'false'}\n")
          PY

  radar:
    needs: verificar
    if: needs.verificar.outputs.rodar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install pypdf==7.0.0

      - name: Verificar filtros e avisos sem enviar
        run: python -m unittest discover -s tests -v

      - name: Coletar licitações
        id: coleta
        run: python coletor.py

      - name: Avisar por e-mail e WhatsApp só se houver novidade
        if: ${{ always() && !cancelled() }}
        id: avisos
        continue-on-error: true
        env:
          COLETA_RESULTADO: ${{ steps.coleta.outcome }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          PAINEL_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python avisar.py

      - name: Atualizar situação dos avisos no painel
        if: ${{ !cancelled() && steps.coleta.outcome == 'success' }}
        run: python coletor.py --revisar-dados

      - name: Guardar histórico (caches e dados)
        if: always()
        run: |
          git config user.name "radar-catarata"
          git config user.email "radar-catarata@users.noreply.github.com"
          for arquivo in dados.json radar.html cache_*.json vistos_oss.json avisados.json status_avisos.json informes.json; do
            if [ -f "$arquivo" ]; then git add -- "$arquivo"; fi
          done
          git diff --cached --quiet || git commit -m "Radar: atualização $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
          git pull --rebase origin main
          git push

      - name: Preparar painel
        if: ${{ !cancelled() && steps.coleta.outcome == 'success' }}
        run: mkdir -p _site && cp radar.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        if: ${{ !cancelled() && steps.coleta.outcome == 'success' }}
        with:
          path: _site

      - id: deploy
        if: ${{ !cancelled() && steps.coleta.outcome == 'success' }}
        uses: actions/deploy-pages@v4

      - name: Sinalizar falha da etapa de avisos
        if: ${{ !cancelled() && steps.avisos.outcome == 'failure' }}
        run: exit 1
